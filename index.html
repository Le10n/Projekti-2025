<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financijski tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div id="desktopBanner" class="desktop-only">&nbsp;</div>
  <div id="mobileOverlay" role="alert">Otvori na računalu</div>
  <div class="app-shell">
    <header class="topbar">
      <h1>Financijski tracker</h1>
      <div class="month-picker">
        <label for="monthPicker">Odaberi mjesec</label>
        <input type="month" id="monthPicker">
      </div>
    </header>

    <section class="kpis" aria-label="Sažetak financija">
      <article id="card-incomes" class="kpi-card" tabindex="0" aria-live="polite">
        <h3>Prihodi</h3>
        <div id="sumIncomes">€ 0,00</div>
      </article>
      <article id="card-expenses" class="kpi-card" tabindex="0" aria-live="polite">
        <h3>Troškovi</h3>
        <div id="sumExpenses">€ 0,00</div>
      </article>
      <article id="card-balance" class="kpi-card" tabindex="0" aria-live="polite">
        <h3>Saldo</h3>
        <div id="sumBalance">€ 0,00</div>
      </article>
    </section>

    <main class="grid">
      <section class="form-panel" aria-labelledby="newTxHeading">
        <h2 id="newTxHeading">Nova transakcija</h2>
        <form id="txForm" novalidate>
          <div class="field">
            <label for="txType">Tip transakcije</label>
            <select id="txType" required>
              <option value="">-- Odaberite --</option>
              <option value="income">Prihod</option>
              <option value="expense">Trošak</option>
            </select>
            <p class="error" data-error-for="txType"></p>
          </div>

          <div class="field">
            <label for="txTitle">Naziv</label>
            <input id="txTitle" type="text" placeholder="npr. Plaća" required>
            <p class="error" data-error-for="txTitle"></p>
          </div>

          <div class="field">
            <label for="txCategory">Kategorija</label>
            <input id="txCategory" type="text" placeholder="npr. Hrana" required>
            <p class="error" data-error-for="txCategory"></p>
          </div>

          <div class="field">
            <label for="txAmount">Iznos</label>
            <input id="txAmount" type="text" inputmode="decimal" placeholder="npr. 25,00" required>
            <p class="error" data-error-for="txAmount"></p>
          </div>

          <div class="field">
            <label for="txDate">Datum</label>
            <input id="txDate" type="date" required>
            <p class="error" data-error-for="txDate"></p>
          </div>

          <div class="field">
            <label for="txNote">Bilješka <span class="muted">(opcionalno)</span></label>
            <textarea id="txNote" placeholder="Opcionalno" rows="3"></textarea>
          </div>

          <div class="form-actions">
            <button id="txSubmit" type="submit" class="btn btn-primary">Spremi</button>
            <button id="txReset" type="reset" class="btn btn-secondary">Očisti</button>
          </div>
        </form>
      </section>

      <section class="chart-panel" aria-labelledby="chartHeading">
        <h2 id="chartHeading">Graf po kategorijama</h2>
        <div class="chart-toggle" role="group" aria-label="Odabir tipa grafa">
          <button id="chartModeExpenses" class="btn-toggle active" type="button">Troškovi</button>
          <button id="chartModeIncomes" class="btn-toggle" type="button">Prihodi</button>
        </div>
        <div class="chart-wrapper">
          <canvas id="categoryChart" width="600" height="380" role="img" aria-label="Graf po kategorijama"></canvas>
          <div id="chartEmpty" class="muted" hidden>Nema podataka za odabrani mjesec i tip.</div>
        </div>
      </section>
    </main>

    <section class="history" aria-labelledby="historyHeading">
      <header class="history-head">
        <h2 id="historyHeading">Povijest transakcija – <span id="historyDateLabel"></span></h2>
        <div class="history-controls" role="group" aria-label="Navigacija dana">
          <button id="prevDay" type="button" aria-label="Prethodni dan">◀</button>
          <input type="date" id="historyDate">
          <button id="nextDay" type="button" aria-label="Sljedeći dan">▶</button>
        </div>
      </header>
      <div class="history-table-wrapper">
        <table id="txTable">
          <thead>
            <tr>
              <th>Tip</th>
              <th>Naziv</th>
              <th>Kategorija</th>
              <th class="align-right">Iznos (EUR)</th>
              <th class="time-col">Vrijeme</th>
              <th>Bilješka</th>
              <th>Akcije</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden>Transakcija dodana</div>

  <div id="editTxModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="editTxTitle">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="editTxTitle">Uredi transakciju</h2>
        <button type="button" class="modal-close" aria-label="Zatvori">×</button>
      </header>
      <form id="editTxForm" novalidate>
        <div class="field">
          <label for="editTxType">Tip transakcije</label>
          <select id="editTxType" required>
            <option value="income">Prihod</option>
            <option value="expense">Trošak</option>
          </select>
          <p class="error" data-error-for="editTxType"></p>
        </div>
        <div class="field">
          <label for="editTxTitleInput">Naziv</label>
          <input id="editTxTitleInput" type="text" required>
          <p class="error" data-error-for="editTxTitleInput"></p>
        </div>
        <div class="field">
          <label for="editTxCategory">Kategorija</label>
          <input id="editTxCategory" type="text" required>
          <p class="error" data-error-for="editTxCategory"></p>
        </div>
        <div class="field">
          <label for="editTxAmount">Iznos</label>
          <input id="editTxAmount" type="text" inputmode="decimal" required>
          <p class="error" data-error-for="editTxAmount"></p>
        </div>
        <div class="field">
          <label for="editTxDate">Datum</label>
          <input id="editTxDate" type="date" required>
          <p class="error" data-error-for="editTxDate"></p>
        </div>
        <div class="field">
          <label for="editTxTime">Vrijeme <span class="muted">(opcionalno)</span></label>
          <input id="editTxTime" type="time">
        </div>
        <div class="field">
          <label for="editTxNote">Bilješka</label>
          <textarea id="editTxNote" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Spremi</button>
          <button type="button" class="btn btn-secondary" data-modal-dismiss>Odustani</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
